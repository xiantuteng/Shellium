# 三平台 × 两架构的安装包构建与发布。
#
# 推送 v* 标签时构建全部 6 个安装包，并创建一个草稿 Release 等人工确认后发布；在 Actions
# 页面手动触发或推送 ci/release-* 分支时只构建并上传 artifact，不创建 Release，用于演练。
#
# 每个架构都在对应架构的原生 runner 上编译，不做交叉编译：Homebrew、MSYS2 和 apt 的依赖都
# 只提供本机架构，交叉编译会在部署阶段混入错误架构的库。
name: Release

on:
  push:
    tags: ['v*']
    # 推送 ci/release-* 分支同样只演练不发布。workflow_dispatch 要求工作流已在默认分支上，
    # 修改流水线本身时只能靠分支推送来验证。
    branches: ['ci/release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 沿用本地发布方式：Homebrew 的 Qt 与依赖，最低系统跟随 Homebrew 瓶子。
          - arch: arm64
            runner: macos-26
            deployment_target: '26.0'
            brew_qt: true
          # GitHub 最后一代 Intel 镜像。Homebrew 对 Intel 只剩 Tier 3 支持，Qt 这种大包的瓶子
          # 可能缺失而触发数小时的源码编译，所以 Qt 改用官方安装器，其余小依赖仍走 Homebrew。
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: '15.0'
            brew_qt: false
    # 未声明 shell 时 GitHub 用 bash -e 而不带 pipefail，`| tee build.log` 会吞掉构建失败。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (official)
        if: ${{ !matrix.brew_qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: |
          packages=(libssh libvterm libsodium spdlog minizip ninja pkg-config)
          if [[ "${{ matrix.brew_qt }}" == "true" ]]; then
            packages+=(qt)
          fi
          brew install "${packages[@]}"

      - name: Build and package
        env:
          SHELLIUM_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          SHELLIUM_BUILD_JOBS: '4'
        # 尚未配置 Developer ID 证书与公证凭据，先产出 ad-hoc 签名包；Release 因此保持草稿。
        run: ./scripts/package_macos_dmg.sh --adhoc 2>&1 | tee build.log

      - name: Report build log
        if: failure()
        run: ./scripts/ci_report_log_tail.sh build.log

      - name: Smoke test
        run: |
          dmg="$(ls dist/Shellium-*-macos-${{ matrix.arch }}-adhoc.dmg)"
          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force' EXIT
          ./scripts/smoke_launch.sh 15 "$mount_point/Shellium.app/Contents/MacOS/Shellium"

      - uses: actions/upload-artifact@v4
        with:
          name: shellium-macos-${{ matrix.arch }}
          path: dist/Shellium-*-macos-${{ matrix.arch }}-adhoc.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MINGW64 环境没有 libvterm 包，x64 必须用 UCRT64。
          - arch: x64
            runner: windows-2025
            msystem: UCRT64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # CLANGARM64 没有 NSIS 包。makensis 只在打包时运行，生成的安装器是 x86 程序，
          # 在 ARM64 Windows 上靠系统自带转译运行，因此两种架构都用 UCRT64 的 NSIS。
          install: mingw-w64-ucrt-x86_64-nsis
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-svg:p qt6-tools:p
            libssh:p libvterm:p libsodium:p spdlog:p minizip:p zlib:p

      - name: Build and stage
        shell: msys2 {0}
        run: |
          set -o pipefail
          # MSYS2 的 vterm.pc 没有 prefix= 行，includedir 写死为 /ucrt64/include。pkgconf 只能重定位
          # ${prefix} 形式的路径，于是原样交给原生 Windows CMake，配置时报“路径不存在”。
          vterm_pc="$MINGW_PREFIX/lib/pkgconfig/vterm.pc"
          if ! grep -q '^prefix=' "$vterm_pc"; then
            sed -i -e "1i prefix=$MINGW_PREFIX" -e "s|=$MINGW_PREFIX/|=\${prefix}/|" "$vterm_pc"
          fi
          {
            cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF &&
            cmake --build build-win --parallel &&
            cmake --install build-win --prefix build-win/windows-staging &&
            bash scripts/bundle_windows_runtime.sh build-win/windows-staging "$MINGW_PREFIX/bin"
          } 2>&1 | tee build.log

      - name: Report build log
        if: failure()
        shell: msys2 {0}
        run: bash scripts/ci_report_log_tail.sh build.log

      # 这一步的 PATH 里没有 MSYS2，才能证明 staging 自带了全部 DLL。
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path build-win/windows-staging/Shellium.exe
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "Shellium.exe exited within 15 seconds (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Smoke test passed."

      - name: Package
        shell: pwsh
        run: |
          $msys = '${{ steps.msys2.outputs.msys2-location }}'
          $prefix = '${{ matrix.msystem }}'.ToLowerInvariant()
          $env:PATH = "$msys\$prefix\bin;$msys\ucrt64\bin;$env:PATH"
          ./scripts/package_windows_native.ps1 -BuildDirectory build-win `
            -Architecture ${{ matrix.arch }} -UseExistingStaging

      - uses: actions/upload-artifact@v4
        with:
          name: shellium-windows-${{ matrix.arch }}
          path: |
            build-win/artifacts/*.zip
            build-win/artifacts/*.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 是满足 libvterm 0.3 / spdlog 1.12 的最老 LTS，生成的 AppImage 因此
          # 要求目标系统 glibc ≥ 2.39。libssh 仓库版只有 0.10，另行从源码编译 0.11。
          - arch: x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    # 未声明 shell 时 GitHub 用 bash -e 而不带 pipefail，`| tee build.log` 会吞掉构建失败。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 发行版自带的 Qt 是 6.4，低于工程要求的 6.8。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config file \
            libssl-dev libvterm-dev libsodium-dev libspdlog-dev libminizip-dev zlib1g-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-xkb1 \
            xvfb xauth

      - name: Install libssh 0.11
        run: |
          sudo ./scripts/install_libssh_from_source.sh /usr/local
          sudo ldconfig

      - name: Build and package
        run: ./scripts/package_linux_appimage.sh 2>&1 | tee build.log

      - name: Report build log
        if: failure()
        run: ./scripts/ci_report_log_tail.sh build.log

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          appimage="$(ls dist/Shellium-*-linux-${{ matrix.arch }}.AppImage)"
          xvfb-run -a ./scripts/smoke_launch.sh 15 "$appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: shellium-linux-${{ matrix.arch }}
          path: dist/Shellium-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 标签和 CMakeLists.txt 的版本不一致时，安装包文件名和 Release 标题会对不上。
      - name: Check tag matches project version
        run: |
          version="$(sed -nE 's/^project\(Shellium VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 CMakeLists.txt 中的版本 ${version} 不一致"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: shellium-*
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shellium ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft \
            ./*
