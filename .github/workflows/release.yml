# 三平台 × 两架构的安装包构建与发布。
#
# 推送 v* 标签时构建全部 6 个安装包，并创建一个草稿 Release 等人工确认后发布；在 Actions
# 页面手动触发或推送 ci/release-* 分支时只构建并上传 artifact，不创建 Release，用于演练。
#
# 每个架构都在对应架构的原生 runner 上编译，不做交叉编译：Homebrew、vcpkg 和 apt 的依赖都
# 按本机架构构建，交叉编译会在部署阶段混入错误架构的库。Windows 使用 MSVC。
name: Release

on:
  push:
    tags: ['v*']
    # 推送 ci/release-* 分支同样只演练不发布。workflow_dispatch 要求工作流已在默认分支上，
    # 修改流水线本身时只能靠分支推送来验证。
    branches: ['ci/release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew 瓶子按构建机系统标注最低系统，包的最低系统因此等于 runner 的系统版本，
          # 要支持旧系统就得在旧系统的 runner 上构建。Homebrew 已不再给 macOS 14 出 libssh、
          # openssl@3 等瓶子，这些包会在 runner 上从源码编译，产物同样以 14.0 为最低系统。
          # Qt 用官方安装器（universal，最低 macOS 12），避免 Homebrew 的 Qt 在旧系统上源码编译。
          - arch: arm64
            runner: macos-14
            deployment_target: '14.0'
          # GitHub 最后一代 Intel 镜像，因此 Intel 包最低只能到 macOS 15。
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: '15.0'
    # 未声明 shell 时 GitHub 用 bash -e 而不带 pipefail，`| tee build.log` 会吞掉构建失败。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (official)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: |
          brew install libssh libvterm libsodium spdlog minizip ninja pkg-config

      - name: Build and package
        env:
          SHELLIUM_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          SHELLIUM_BUILD_JOBS: '4'
        # 尚未配置 Developer ID 证书与公证凭据，先产出 ad-hoc 签名包；Release 因此保持草稿。
        run: ./scripts/package_macos_dmg.sh --adhoc 2>&1 | tee build.log

      - name: Report build log
        if: failure()
        run: ./scripts/ci_report_log_tail.sh build.log

      - name: Smoke test
        run: |
          dmg="$(ls dist/Shellium-*-macos-${{ matrix.arch }}-adhoc.dmg)"
          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force' EXIT
          ./scripts/smoke_launch.sh 15 "$mount_point/Shellium.app/Contents/MacOS/Shellium"

      - uses: actions/upload-artifact@v4
        with:
          name: shellium-macos-${{ matrix.arch }}
          path: dist/Shellium-*-macos-${{ matrix.arch }}-adhoc.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC 原生编译：Qt 用官方 MSVC 2022 二进制，其余依赖由 vcpkg 按
          # packaging/windows/vcpkg/vcpkg.json 构建（libvterm 无官方 port，用仓库内 overlay）。
          - arch: x64
            runner: windows-2025
            msvc_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            triplet: x64-windows
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            triplet: arm64-windows
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/../vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      # 第三方依赖每次从源码编译要十几分钟；按清单与 overlay 内容缓存 vcpkg 的二进制包。
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('packaging/windows/vcpkg/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      # 不用 runner 预装的 vcpkg：它的提交随镜像更新而变。按清单里的 builtin-baseline 检出，
      # 依赖版本只随清单改变。
      - name: Set up vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content packaging/windows/vcpkg/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg $root
          git -C $root checkout $baseline
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE_DIR | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE_DIR,readwrite" >> $env:GITHUB_ENV

      - name: Build and stage
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & {
            cmake -S . -B build-win -G Ninja `
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_MANIFEST_DIR=packaging/windows/vcpkg `
              -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
              "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
            cmake --build build-win --parallel
            # Qt 6.8 的部署脚本要求绝对路径，相对 prefix 会在生成 qt.conf 时报错。
            cmake --install build-win --prefix "$PWD/build-win/windows-staging"
          } *>&1 | Tee-Object -FilePath build.log

      # windeployqt 只带 Qt 自己的 DLL；vcpkg 的库（含 OpenSSL）与 MSVC 运行库在这里补齐。
      - name: Bundle runtime DLLs
        shell: bash
        run: |
          set -o pipefail
          crt_dir="$(find "$(cygpath -u "$VCToolsRedistDir")/${{ matrix.msvc_arch }}" -maxdepth 1 -type d -name 'Microsoft.VC*.CRT' | head -n 1)"
          [[ -n "$crt_dir" ]] || { echo "找不到 MSVC 运行库目录" >&2; exit 1; }
          OBJDUMP="$PWD/scripts/dumpbin_as_objdump.sh" bash scripts/bundle_windows_runtime.sh \
            build-win/windows-staging \
            "build-win/vcpkg_installed/${{ matrix.triplet }}/bin" \
            "$(cygpath -u "$QT_ROOT_DIR")/bin" \
            "$crt_dir" 2>&1 | tee -a build.log

      - name: Report build log
        if: failure()
        shell: bash
        run: bash scripts/ci_report_log_tail.sh build.log

      # 这一步只有系统 PATH，证明 staging 自带了全部 DLL。
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path build-win/windows-staging/Shellium.exe
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "Shellium.exe exited within 15 seconds (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Smoke test passed."

      - name: Package
        shell: pwsh
        run: |
          # ARM64 镜像预装了 NSIS，x64 镜像没有。NSIS 安装器是 x86 程序，ARM64 Windows 经转译运行。
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            choco install nsis -y --no-progress
          }
          $env:PATH = "$nsisDir;$env:PATH"
          # 抛出的异常不进管道，Tee-Object 记不到；catch 里单独写入日志供失败注解使用。
          try {
            ./scripts/package_windows_native.ps1 -BuildDirectory build-win `
              -Architecture ${{ matrix.arch }} -UseExistingStaging *>&1 | Tee-Object -FilePath package.log
          } catch {
            $_ | Out-String | Add-Content -Path package.log
            throw
          }

      - name: Report package log
        if: failure()
        shell: bash
        run: bash scripts/ci_report_log_tail.sh package.log

      - uses: actions/upload-artifact@v4
        with:
          name: shellium-windows-${{ matrix.arch }}
          path: |
            build-win/artifacts/*.zip
            build-win/artifacts/*.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 是满足 libvterm 0.3 / spdlog 1.12 的最老 LTS，生成的 AppImage 因此
          # 要求目标系统 glibc ≥ 2.39。libssh 仓库版只有 0.10，另行从源码编译 0.11。
          - arch: x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    # 未声明 shell 时 GitHub 用 bash -e 而不带 pipefail，`| tee build.log` 会吞掉构建失败。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 发行版自带的 Qt 是 6.4，低于工程要求的 6.8。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config file \
            libssl-dev libvterm-dev libsodium-dev libspdlog-dev libminizip-dev zlib1g-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-xkb1 \
            xvfb xauth

      - name: Install libssh 0.11
        run: |
          sudo ./scripts/install_libssh_from_source.sh /usr/local
          sudo ldconfig

      - name: Build and package
        run: ./scripts/package_linux_appimage.sh 2>&1 | tee build.log

      - name: Report build log
        if: failure()
        run: ./scripts/ci_report_log_tail.sh build.log

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          appimage="$(ls dist/Shellium-*-linux-${{ matrix.arch }}.AppImage)"
          xvfb-run -a ./scripts/smoke_launch.sh 15 "$appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: shellium-linux-${{ matrix.arch }}
          path: dist/Shellium-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 标签和 CMakeLists.txt 的版本不一致时，安装包文件名和 Release 标题会对不上。
      - name: Check tag matches project version
        run: |
          version="$(sed -nE 's/^project\(Shellium VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 CMakeLists.txt 中的版本 ${version} 不一致"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: shellium-*
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shellium ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft \
            ./*
