# Shellium Flatpak 清单，由 scripts/package_linux_flatpak.sh 构建为单文件 .flatpak。
#
# Qt 来自 KDE 运行时（与开发环境同为 6.11，满足工程的 6.8+ 要求）；运行时没有的依赖在下面逐个
# 从源码编译，版本与 SHA-256 和其他平台的构建脚本保持一致。
#
# 沙箱权限按功能逐项给出：
# - talk-name=org.freedesktop.Flatpak：本地终端经 flatpak-spawn --host 在宿主上启动 Shell，
#   否则只能拿到运行时自带的 /bin，见 LocalShellWorker::posixLaunchArguments。
# - filesystem=home：读取 ~/.ssh 下的密钥与配置，以及 SFTP 上传下载的本地文件。
# - socket=ssh-auth：使用宿主的 ssh-agent。
# - 只给 x11 不给 wayland：与 AppImage 一样走 xcb 平台插件，终端渲染只在 xcb 下验证过。
app-id: net.shellium.Shellium
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Shellium
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - '*.a'
  - '*.la'

modules:
  - name: libsodium
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
        sha256: ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19

  # libssh 拒绝在源码目录里配置（MacroEnsureOutOfSourceBuild），必须 builddir: true。
  - name: libssh
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DWITH_EXAMPLES=OFF
      - -DUNIT_TESTING=OFF
      - -DCLIENT_TESTING=OFF
      - -DWITH_GSSAPI=OFF
    sources:
      - type: archive
        url: https://www.libssh.org/files/0.11/libssh-0.11.5.tar.xz
        sha256: 6898ba9dd836d618b71dc7a4bb786a502c173cef5cafbf20fe5e0567ba4ea30c

  # libghostty-vt 只发源码，需要 Zig 0.17.x 构建；Zig 工具链作为本模块的源码一并下载，只在构建期使用，
  # 不会进入 /app。依赖包与源码包必须同版本，--system 让 Zig 使用已解包的依赖而不联网
  # （flatpak-builder 的构建阶段没有网络）。strip-components 默认为 1，所以三个包各放进自己的 dest。
  - name: libghostty-vt
    buildsystem: simple
    build-commands:
      - cd src && ZIG_GLOBAL_CACHE_DIR="${FLATPAK_BUILDER_BUILDDIR}/zig-cache" ../zig/zig build --prefix /app --system ../deps -Doptimize=ReleaseFast -Dcpu=baseline
    sources:
      - type: archive
        url: https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
        sha256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
        dest: zig
        only-arches: [x86_64]
      - type: archive
        url: https://ziglang.org/download/0.17.1/zig-aarch64-linux-0.17.1.tar.xz
        sha256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
        dest: zig
        only-arches: [aarch64]
      - type: archive
        url: https://release.files.ghostty.org/libghostty-vt/1.0.0/libghostty-vt-1.0.0.tar.gz
        sha256: 4a6ef758be721923e1969e7b81b443dcc92d8dd3fb5a39600c03a8817a753676
        dest: src
      - type: archive
        url: https://release.files.ghostty.org/libghostty-vt/1.0.0/libghostty-vt-1.0.0-deps.tar.gz
        sha256: 4d5ea5e448e4c7ea8fb55ccbaa8668f2a97d44f438cee831e2b7ecd162d85c29
        dest: deps

  - name: spdlog
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DSPDLOG_BUILD_SHARED=OFF
      - -DSPDLOG_BUILD_EXAMPLE=OFF
      - -DSPDLOG_BUILD_TESTS=OFF
      - -DSPDLOG_BUILD_BENCH=OFF
    sources:
      - type: archive
        url: https://github.com/gabime/spdlog/archive/refs/tags/v1.15.3.tar.gz
        sha256: 15a04e69c222eb6c01094b5c7ff8a249b36bb22788d72519646fb85feb267e67

  # minizip 是 zlib 源码里 contrib/minizip 的那一份，与 Debian/Ubuntu 的 libminizip 同源。
  - name: minizip
    buildsystem: simple
    subdir: contrib/minizip
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=/app --disable-static
      - make -j "${FLATPAK_BUILDER_N_JOBS}"
      - make install
    sources:
      - type: archive
        url: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
        sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23

  - name: shellium
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    post-install:
      - install -d /app/share/applications
      - sed -e 's/^Icon=.*/Icon=net.shellium.Shellium/' "${FLATPAK_BUILDER_BUILDDIR}/packaging/linux/shellium.desktop" > /app/share/applications/net.shellium.Shellium.desktop
      - install -Dm644 "${FLATPAK_BUILDER_BUILDDIR}/packaging/linux/shellium.png" /app/share/icons/hicolor/256x256/apps/net.shellium.Shellium.png
    sources:
      # 源码目录里的本地构建产物不能拷进沙箱构建目录，否则 CMake 会撞上旧缓存。
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - build-release-arm64
          - build-release-linux-x86_64
          - build-release-linux-aarch64
          - build-flatpak
          - dist
          - Testing
